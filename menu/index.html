<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dumplings &amp; Draught Menus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@500&family=Yellowtail&display=swap">
<style>
:root{--paper:#efe3d0;--ink:#2a2420;--muted:#6a5d4e;--line:#cdb99c;--ox:#c4573c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1c1714;--ink:#f1e6d6;--muted:#b5a28c;--line:#4a3b30;--ox:#e98a5c}}
:root[data-theme="dark"]{--paper:#1c1714;--ink:#f1e6d6;--muted:#b5a28c;--line:#4a3b30;--ox:#e98a5c}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'IBM Plex Mono',monospace;min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
main{max-width:560px;width:100%;text-align:center}
h1{font:400 clamp(44px,10vw,76px)/1 Yellowtail,cursive;color:var(--ox);margin:8px 0 6px}
p{color:var(--muted);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 28px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
a.card{display:block;border:1px solid var(--line);border-radius:14px;padding:22px 16px;color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--ox)}
a.card b{display:block;font:700 26px/1.1 'Bricolage Grotesque',serif;margin-bottom:6px}
a.card span{font-size:11.5px;color:var(--muted)}
.pdf{margin-top:18px;font-size:12px}
.pdf a{color:var(--ox)}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <p>Betalbatim · a short walk from the Arabian Sea</p>
  <h1>dumplings &amp; draught</h1>
  <p>Choose a menu</p>
  <div class="cards">
    <a class="card" href="food/"><b>Food</b><span>Soups, cabin starters, dim sum, bao, Korean corner, mains, sets, sweets</span></a>
    <a class="card" href="drinks/"><b>Drinks</b><span>Craft taps, whisky &amp; vodka, cocktails, zero proof, soft drinks, coffee</span></a>
  </div>
  <div class="pdf">Print (A2 board): <a href="../menu-board.pdf">both sides</a> · <a href="../menu-food.pdf">food side</a> · <a href="../menu-drinks.pdf">drinks side</a></div>
</main>
</body>
</html>
